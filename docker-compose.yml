services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fleetlog-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_NAME: "${APP_NAME:-Fleetlog}"
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost:8080}"
      APP_KEY: "${APP_KEY:-}"
      FORCE_HTTPS: "${FORCE_HTTPS:-false}"
      DB_CONNECTION: "${DB_CONNECTION:-mysql}"
      DB_HOST: "${DB_HOST:-db}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE:-fleetlog_system}"
      DB_USERNAME: "${DB_USERNAME:-fleetlog}"
      DB_PASSWORD: "${DB_PASSWORD:-fleetlog_secret}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-*}"
      AUTO_SEED: "${AUTO_SEED:-true}"
    volumes:
      - fleetlog_storage:/var/www/html/storage/app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: fleetlog-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-fleetlog_system}"
      MYSQL_USER: "${DB_USERNAME:-fleetlog}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-fleetlog_secret}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-fleetlog_root_secret}"
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-3309}:3306"
    volumes:
      - fleetlog_db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  fleetlog_db:
  fleetlog_storage:
